# =============================================================================
# dice-simulator.genzouw.com デプロイ
# =============================================================================
# main への push で静的ファイルを S3 へ同期し、CloudFront のキャッシュを消す。
# ビルド工程は無い (クライアントサイド Vue をそのまま配信する)。
# =============================================================================
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: genzouw-static-content
  S3_PREFIX: dice-simulator
  CLOUDFRONT_DISTRIBUTION_ID: E6OM0XCJX1HGU

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC で AWS ロールを引き受けるために必要
      contents: read

    # 本リポジトリは公開されているため、本番デプロイは GitHub Environment 経由に
    # 限定している。この宣言があると OIDC トークンの subject が
    #
    #   repo:genzouw/dice-simulator:environment:production
    #
    # となり、AWS 側の信頼ポリシーがこの形だけを許可している。environment を
    # 宣言しないワークフローや main 以外のブランチからのワークフローは、
    # デプロイ用ロールを引き受けられない (production 環境のデプロイ可能ブランチを
    # main に限定しているため)。
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 配信するものだけを集める。
      #
      # 以前はリポジトリ全体を sync し、CI 設定などを --exclude で落としていたが、
      # 除外の書き忘れがそのまま公開に直結する (拒否リストの失敗モード)。
      # 配信するファイルを明示して集める方式なら、新しく増えたファイルは
      # 既定で公開されない。
      #
      # dice-with-a-six.png は index.html / main.js から参照されておらず
      # (og:image も favicons/site-tile-150x150.png を指している)、GitHub の
      # social preview にも使われていない未使用ファイルのため配信対象に
      # 含めない。
      - name: Collect publishable files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html main.js dist/
          cp -R favicons dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::107060754911:role/genzouw-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # dist/ に無いものは S3 からも消える (--delete)。過去に誤って公開された
      # ファイルもこれで取り除かれる。
      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --delete \
            --cache-control "public, max-age=3600"

      # index.html と main.js はファイル名にハッシュを含まないため、直後の
      # CloudFront invalidation だけではブラウザ側のキャッシュに効かない。
      # deploy 直後に確実に最新を取得できるよう no-cache (= 毎回サーバへ
      # 再検証させる) で上書きする。favicons は更新頻度が低いため 1 時間
      # キャッシュ (Sync to S3 で設定済み) のままでよい。
      - name: Override Cache-Control for index.html and main.js
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/${S3_PREFIX}/index.html" \
            --cache-control "no-cache"
          aws s3 cp dist/main.js "s3://${S3_BUCKET}/${S3_PREFIX}/main.js" \
            --cache-control "no-cache"

      # 配信元の S3 バケットと CloudFront distribution は他のサブドメインと共有して
      # いる。"/*" で消すと hyakuninissyu / kakezan / kanji のキャッシュまで巻き添えに
      # なるため、自分のプレフィックス配下だけを対象にする。
      #
      # CloudFront Function がビューワーリクエストの URI を "/dice-simulator/..." に
      # 書き換えたものがキャッシュキーになるので、invalidation もこの形で指定する。
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/${S3_PREFIX}/*"
